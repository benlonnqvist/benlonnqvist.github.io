<footer class="site-footer">
  <div class="wrap foot">
    <div>
      <div class="brand">Ben Lonnqvist</div>
      <p class="muted">{{ site.author.role }}, <a href="{{ site.author.org_url }}">{{ site.author.org }}</a></p>
    </div>
    <ul class="foot-links">
      <li>{{ site.author.email }}</li>
      {% for l in site.links %}<li><a href="{{ l.url }}">{{ l.label }}</a></li>{% endfor %}
    </ul>
    <p class="muted small">© {{ site.time | date: '%Y' }} Ben Lonnqvist</p>
  </div>
</footer>
