# Site settings ---------------------------------------------------------------
title: "Ben Lonnqvist"
tagline: "Head of NeuroAI, Read/Write Labs"
description: >-
  Ben Lonnqvist is Head of NeuroAI at Read/Write Labs. His research compares
  human and machine vision at scale and builds brain models precise enough to act on.
url: "https://benlonnqvist.github.io"
baseurl: ""
lang: en
timezone: Europe/Zurich

author:
  name: "Ben Lonnqvist"
  email: "benhlonnqvist [at] gmail [dot] com"
  role: "Head of NeuroAI"
  org: "Read/Write Labs"
  org_url: "https://readwritelabs.com"
  photo: "/assets/images/portrait-2026.jpg"

cv_pdf: "/cv/Ben_Lonnqvist_CV.pdf"

# Profile links (shown in header/footer, in this order)
links:
  - label: "Google Scholar"
    short: "scholar"
    url: "https://scholar.google.com/citations?user=be0tNVwAAAAJ&hl=en"
  - label: "GitHub"
    short: "github"
    url: "https://github.com/benlonnqvist"
  - label: "LinkedIn"
    short: "linkedin"
    url: "https://www.linkedin.com/in/benlonnqvist"
  - label: "X"
    short: "x"
    url: "https://x.com/lonnqvistben"

# Social preview
image: "/assets/images/og-card.png"
twitter:
  username: lonnqvistben
social:
  name: "Ben Lonnqvist"
  links:
    - "https://x.com/lonnqvistben"
    - "https://github.com/benlonnqvist"
    - "https://www.linkedin.com/in/benlonnqvist"

# Build ------------------------------------------------------------------------
markdown: kramdown
kramdown:
  input: GFM
permalink: /news/:year/:title/
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-redirect-from

feed:
  path: news/feed.xml

defaults:
  - scope: { path: "", type: posts }
    values: { layout: post }
  - scope: { path: "" }
    values: { layout: default }

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - tools
  - cv/*.tex
  - cv/*.cls
  - cv/build
