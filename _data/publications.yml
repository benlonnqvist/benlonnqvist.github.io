- id: lonnqvist2025contour
  title: "Contour Integration Underlies Human-Like Vision"
  authors: ["Lonnqvist B", "Scialom E", "Gokce A", "Merchant Z", "Herzog MH", "Schrimpf M"]
  venue: "International Conference on Machine Learning (PMLR 267)"
  venue_short: "ICML"
  year: 2025
  type: conference
  topics: [benchmarking, grouping]
  featured: true
  image: "/assets/images/contour_graph_abstract.png"
  summary: >-
    Humans and more than 1,000 models were tested on objects whose contours are progressively fragmented.
    Humans stay accurate with very few visible contours, while most models fall to near chance. Only models
    trained on around 5 billion examples approach human performance, and the human-like bias for
    directional fragments grows with training data.
  links:
    paper: "https://proceedings.mlr.press/v267/lonnqvist25a.html"
    arxiv: "https://arxiv.org/abs/2504.05253"
    poster: "/download/ICML2025_poster_BL.pdf"
    press: "https://actu.epfl.ch/news/ai-can-t-see-as-well-as-humans-and-how-to-fix-it/"
  bibtex: |-
    @inproceedings{lonnqvist2025contour,
      title     = {Contour Integration Underlies Human-Like Vision},
      author    = {Lonnqvist, Ben and Scialom, Elsa and Gokce, Abdulkadir and Merchant, Zehra and Herzog, Michael H. and Schrimpf, Martin},
      booktitle = {Proceedings of the 42nd International Conference on Machine Learning},
      series    = {Proceedings of Machine Learning Research},
      volume    = {267},
      pages     = {40290--40311},
      year      = {2025}
    }

- id: lonnqvist2024latent
  title: "Latent Noise Segmentation: How Neural Noise Leads to the Emergence of Segmentation and Grouping"
  authors: ["Lonnqvist B*", "Wu Z*", "Herzog MH"]
  venue: "International Conference on Machine Learning (PMLR 235)"
  venue_short: "ICML"
  year: 2024
  type: conference
  topics: [grouping]
  featured: true
  summary: >-
    Neural noise in a variational autoencoder's latent space is enough to segment images without supervision.
    The resulting model reproduces many hallmark effects of human perceptual grouping.
  links:
    paper: "https://proceedings.mlr.press/v235/lonnqvist24a.html"
    arxiv: "https://arxiv.org/abs/2309.16515"
    press: "https://www.tekniikkatalous.fi/uutiset/a/ce8be5c9-349d-44b0-8462-242bc08ec275"
  bibtex: |-
