- id: mehrer2026microstim
  title: "Model-Guided Microstimulation Steers Primate Visual Behavior"
  authors: ["Mehrer J", "Lonnqvist B", "Mitola A", "Papale P", "Schrimpf M"]
  venue: "International Conference on Learning Representations"
  venue_short: "ICLR"
  year: 2026
  type: conference
  topics: [neurotech]
  featured: true
  summary: >-
    A model that predicts how image input and cortical stimulation jointly drive behavior is used to choose
    stimulation sites in macaque visual cortex. Model-guided microstimulation steered the monkeys' object
    choices, a proof of principle for prostheses that target higher-level visual cortex.
  links:
    paper: "https://openreview.net/pdf/7296590e8a14124c7fbed081f20b1d8839a4c8e3.pdf"
    arxiv: "https://arxiv.org/abs/2510.03684"
  bibtex: |-
    @inproceedings{mehrer2026microstimulation,
      title     = {Model-Guided Microstimulation Steers Primate Visual Behavior},
      author    = {Mehrer, Johannes and Lonnqvist, Ben and Mitola, Anna and Papale, Paolo and Schrimpf, Martin},
      booktitle = {International Conference on Learning Representations (ICLR)},
      year      = {2026}
    }

- id: scialom2026prosthetic
  title: "Diagnostic features predicted by deep learning improve human object recognition in simulated prosthetic vision"
  authors: ["Scialom E", "Lonnqvist B", "Bornet A", "Herzog MH"]
  venue: "Journal of Neural Engineering"
  venue_short: "J. Neural Eng."
  year: 2026
  type: journal
  topics: [neurotech, benchmarking]
  featured: false
  summary: >-
    Deep networks predict which image features are diagnostic for recognising an object. Rendering those
    features in simulated prosthetic vision improves how well people recognise objects.
  links:
    paper: "https://doi.org/10.1088/1741-2552/ae9227"
