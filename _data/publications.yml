  venue_short: "Neural Netw."
  year: 2020
  type: journal
  topics: [benchmarking]
  featured: false
  summary: >-
    Visual crowding, where clutter impairs recognition in peripheral vision, behaves differently in
    convolutional neural networks than in human observers.
